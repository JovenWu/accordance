id: gri-11-oil-gas
name: "GRI 11: Oil and Gas Sector 2021"
standard: "GRI 11: Oil and Gas Sector 2021"
# Likely material topics -> relevant disclosures. Topic-standard refs use the
# editions cited in the GRI 11: Oil and Gas Sector 2021 standard.
# NOTE on 306-3 ID collision: Topic 11.8 (Asset integrity & critical incident
# management) cites "GRI 306: Effluents and Waste 2016, Disclosure 306-3
# Significant spills" (a WITHDRAWN standard). This collides with 306-3 "Waste
# generated" from GRI 306: Waste 2020 used in Topic 11.5. The spills disclosure
# is intentionally omitted from Topic 11.8 to avoid mapping to the wrong KB
# entry; use the sector disclosures 11.8.3/11.8.4 for spill/incident coverage.
# NOTE on biodiversity IDs: biodiversity uses GRI 101: Biodiversity 2024 (the
# current mandatory edition); GRI 304: Biodiversity 2016 is superseded and
# intentionally not referenced — consistent with the other sector presets and
# the KB's edition gating.
