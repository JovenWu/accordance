id: gri-13-agri
name: "GRI 13: Agriculture, Aquaculture and Fishing Sectors 2022"
standard: "GRI 13: Agriculture, Aquaculture and Fishing Sectors 2022"
# Likely material topics -> relevant disclosures. Topic-standard refs use the
# currently-effective editions. Note:
# BIODIVERSITY (13.3): uses GRI 101: Biodiversity 2024 set (101-1..101-8) per
# GRI 13 V1.1 alignment with GRI 101 (GRI 304: Biodiversity 2016 is withdrawn).
# WASTE (13.8): 306-3 here = "Waste generated" from GRI 306: Waste 2020 — not the
# withdrawn GRI 306: Effluents and Waste 2016 disclosure of the same number ("Significant
# spills"); no ID collision exists in GRI 13 (the 2016 306-3 does not appear in this standard).
