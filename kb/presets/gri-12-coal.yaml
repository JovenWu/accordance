id: gri-12-coal
name: "GRI 12: Coal Sector 2022"
standard: "GRI 12: Coal Sector 2022"
# Likely material topics -> relevant disclosures for GRI 12: Coal Sector 2022.
# Topic-standard refs use currently-effective editions (GRI 305/302/303/306-2020/403/207).
# Topic 12.5 Biodiversity: uses GRI 101: Biodiversity 2024 disclosures
#   {101-1,101-2,101-4,101-5,101-6,101-7,101-8} per GRI 12 V1.1 (Jan 2026) alignment
#   + GRI 101:2024 mandatory from 1 Jan 2026 (excludes 101-3 per coal-sector assessment).
#   The original GRI 12:2022 text cites GRI 304:2016 — omitted as superseded.
# Topic 12.13 Asset integrity: the published standard cites "306-3 Significant spills"
#   from the WITHDRAWN GRI 306: Effluents and Waste 2016 — a different disclosure than
#   306-3 "Waste generated" (GRI 306: Waste 2020). That withdrawn-edition 306-3 is
#   intentionally OMITTED from topic 12.13. 306-3 in topic 12.6 (Waste) is correct —
#   it refers to the current GRI 306: Waste 2020.
