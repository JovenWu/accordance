id: "306-5"
standard: "GRI 306: Waste 2020"
title: "Waste directed to disposal"
category: topic
requirement_text: |
    Report the total weight of waste directed to disposal in metric tons, and a breakdown of this total
    by composition of the waste. Break down the total weight of hazardous waste and of non-hazardous
    waste directed to disposal by the disposal operations used (incineration with energy recovery,
    incineration without energy recovery, landfilling, other disposal operations), distinguishing waste
    directed to disposal onsite and offsite. Provide the contextual information necessary to understand
    the data and how it has been compiled.
required_elements:
  - id: total_waste_disposed
    desc: "Total weight of waste directed to disposal in metric tons, broken down by composition"
  - id: hazardous_disposal_operations
    desc: "Hazardous waste to disposal, by operation (incineration w/ or w/o energy recovery, landfill, other)"
  - id: non_hazardous_disposal_operations
    desc: "Non-hazardous waste to disposal, by disposal operation, distinguishing onsite vs offsite"
retrieval_queries:
  - "waste directed to disposal landfill incineration metric tons"
  - "waste disposal operations landfilling incineration onsite offsite hazardous"
  - "waste to landfill incineration energy recovery tonnes disposal"
good_evidence_hints:
  - "Look for a waste table showing landfill/incineration tonnages split hazardous vs non-hazardous"
  - "Strong evidence breaks disposal down by operation and onsite/offsite"
suggested_fix_template: |
    Add a section reporting total waste directed to disposal (metric tons) by composition, with
    hazardous and non-hazardous breakdowns by disposal operation (incineration with/without energy
    recovery, landfilling, other) and onsite/offsite.
