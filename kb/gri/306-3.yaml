id: "306-3"
standard: "GRI 306: Waste 2020"
title: "Waste generated"
category: topic
requirement_text: |
    Report the total weight of waste generated in metric tons, and a breakdown of this total by
    composition of the waste. Provide the contextual information necessary to understand the data and
    how the data have been compiled.
required_elements:
  - id: total_waste_generated
    desc: "Total weight of waste generated in metric tons"
  - id: waste_by_composition
    desc: "Breakdown of total waste generated by composition (e.g., type/material)"
  - id: contextual_information
    desc: "Contextual information needed to understand the data and how it was compiled"
retrieval_queries:
  - "total waste generated metric tons composition breakdown"
  - "waste generated tonnes hazardous non-hazardous composition"
  - "waste quantity generated by type reporting period"
good_evidence_hints:
  - "Look for a waste table giving total tonnes generated broken down by waste type"
  - "Strong evidence reports totals in metric tons with a composition breakdown"
suggested_fix_template: |
    Add a waste table reporting total waste generated in metric tons, broken down by composition, with
    the contextual information needed to interpret and reconcile the figures.
