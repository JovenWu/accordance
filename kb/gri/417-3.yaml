id: "417-3"
standard: "GRI 417: Marketing and Labeling 2016"
title: "Incidents of non-compliance concerning marketing communications"
category: topic
requirement_text: |
    Report the total number of incidents of non-compliance with regulations and/or voluntary codes
    concerning marketing communications, including advertising, promotion, and sponsorship, within the
    reporting period, by: incidents of non-compliance with regulations resulting in a fine or penalty;
    incidents of non-compliance with regulations resulting in a warning; and incidents of non-compliance
    with voluntary codes. If the organization has not identified any non-compliance, a brief statement
    of this fact is sufficient.
required_elements:
  - id: incidents_with_regulations
    desc: "Incidents of non-compliance with regulations (marketing/advertising/promotion/sponsorship) resulting in a fine/penalty or a warning"
  - id: incidents_with_voluntary_codes
    desc: "Incidents of non-compliance with voluntary codes (or a statement that none were identified)"
retrieval_queries:
  - "incidents non-compliance marketing communications advertising fines warnings"
  - "advertising promotion sponsorship non-compliance voluntary codes incidents"
  - "marketing communications violations fines warnings codes"
good_evidence_hints:
  - "Look in marketing, advertising, or responsible-marketing compliance sections"
  - "Strong evidence breaks incidents into fines, warnings, and voluntary-code breaches (or states none)"
suggested_fix_template: |
    Add a section reporting incidents of non-compliance concerning marketing communications
    (advertising, promotion, sponsorship), split by regulatory fines/penalties, regulatory warnings, and
    voluntary-code breaches (stating none explicitly where applicable).
