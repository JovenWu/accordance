id: "305-4"
standard: "GRI 305: Emissions 2016"
title: "GHG emissions intensity"
category: topic
requirement_text: |
    Report the GHG emissions intensity ratio for the organization, the organization-specific metric (denominator) chosen, the types of emissions (Scope 1, 2, and/or 3) included, and the gases included.
required_elements:
  - id: intensity_ratio
    desc: "GHG emissions intensity ratio for the organization"
  - id: denominator_metric
    desc: "Organization-specific metric (the denominator) chosen to calculate the ratio"
  - id: scopes_included
    desc: "Types of GHG emissions included in the ratio (direct Scope 1, energy indirect Scope 2, and/or other indirect Scope 3)"
  - id: gases_included
    desc: "Gases included in the calculation (CO2, CH4, N2O, HFCs, PFCs, SF6, NF3, or all)"
retrieval_queries:
  - "GHG emissions intensity ratio tCO2e per unit revenue product employee"
  - "carbon intensity per million revenue per ton product per FTE"
  - "emissions intensity Scope 1 Scope 2 denominator metric"
good_evidence_hints:
  - "Look for an intensity figure expressed as emissions per unit of activity (per revenue, per ton of product, per employee, per m2)"
  - "Good evidence states the numerator scopes and the denominator metric clearly"
suggested_fix_template: |
    Add the GHG emissions intensity ratio, specify the organization-specific denominator metric, state which scopes are included in the numerator, and list the gases included.
superseded_by: "GRI 102: Climate Change 2025"
