[project]
name = "accordance"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "flashrank>=0.2.9,<0.3",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20,<0.1",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-anthropic>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-community>=0.4,<1.0",
  "docling>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "tiktoken>=0.8,<1.0",
  "pymupdf>=1.24,<2.0",
  "pymupdf4llm>=0.0.17,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accordance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/accordance/judge/snap.py" = ["RUF001"]
"src/accordance/judge/prompts.py" = ["E501"]
"tests/**" = ["E501", "E402", "B008"]
