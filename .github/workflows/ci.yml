name: CI

# The quality gate that was missing: lint + type-check + tests on every push to
# main and every PR. This is what keeps red tests / lint from silently landing
# on main (which is how the schema-version test rot + lint debt accumulated).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gri
          POSTGRES_PASSWORD: gri
          POSTGRES_DB: gri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gri -d gri"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install CPU torch + backend (dev)
        # Pre-install the CPU-only torch BEFORE the backend so docling's
        # transitive torch resolves to the CPU wheel instead of the ~4GB CUDA
        # build (mirrors the Dockerfile). Pins match the Dockerfile.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0 torchvision==0.27.0
          pip install -e ".[dev]"
          pip install pytest-timeout

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # --timeout guards the known process-accumulation hang so a stuck test
        # fails the job instead of hanging it. -p no:cacheprovider keeps runs
        # order-independent.
        env:
          TEST_DATABASE_URL: postgresql://gri:gri@localhost:5432/gri
        run: pytest -q -p no:cacheprovider --timeout=300

  frontend:
    name: frontend (eslint + build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Tests (vitest)
        run: npx vitest run
