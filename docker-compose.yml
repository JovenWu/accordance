name: accordance

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: accordance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accordance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-accordance}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accordance} -d ${POSTGRES_DB:-accordance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: accordance:latest
    container_name: accordance
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8151:8151"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-accordance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-accordance}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8151/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    name: gri-lens_pgdata
